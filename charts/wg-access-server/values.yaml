# wg-access-server config
config:
  # The global log level.
  # NOTE: the key is all lowercase - the server's yaml tag is `loglevel`, and
  # yaml.v2 matches keys case-sensitively, so `logLevel` is silently ignored.
  loglevel: info
  # The external origin of the server, e.g. https://vpn.example.com. This is
  # written into the client configuration files as the Endpoint, so it has to be
  # set to something clients can actually reach.
  # Since v1.3.0 it also pins the host that passkeys (2FA) are bound to: set it
  # to the name users type, or passkeys registered via another name stop working.
  # externalHost:
  # Networks (YAML list of CIDRs or addresses) requests reach the server through,
  # e.g. the ingress controller. Only from them is X-Forwarded-For believed.
  # trustedProxies: ["10.0.0.0/8"]
  # Maximum number of devices a single user may create. 0 means no limit.
  # Admins are not exempt.
  maxDevicesPerUser: 0
  # Let users create API tokens for scripts (wg-access-server >= v1.3.0).
  enableApiTokens: false
  # Longest an API token works, counted from its creation, e.g. 720h (at least
  # 1m). 0s means no cap (a bare 0 fails to parse).
  apiTokenMaxLifetime: 0s
  # Serve the web UI over plain HTTP on port 8000 as well (default true). Client
  # configs contain private keys, so only disable with HTTPS on (see https.*).
  # httpEnabled: true
  # Collect device metadata logging (last handshake, RX/TX). Required for "Last seen" in the UI.
  enableMetadata: false
  # Expose device-level Prometheus metrics on /metrics. Requires enableMetadata to be effective.
  enableDeviceMetrics: true
  # Enable/Disable the automatic deletion of inactive devices.
  enableInactiveDeviceDeletion: false
  # The duration after which inactive devices are automatically deleted, if automatic deletion is enabled. A device is inactive if it has not been connected to the server for longer than the inactive device grace period. The duration format is the go duration string format
  inactiveDeviceGracePeriod: 8760h
  # Change the name of the configuration file the user can download (Do not include the '.conf' extension )
  filename: WireGuard
  dns:
    # Enable/disable the embedded DNS proxy server. This is enabled by default and allows VPN clients to avoid DNS leaks by sending all DNS requests to wg-access-server itself.
    enabled: true
    # The upstream DNS servers to proxy DNS requests to. By default the host machine's resolveconf configuration is used to find its upstream DNS server, with a fallback to Cloudflare.
    # upstream: resolvconf
    # A domain to serve configured devices authoritatively. Queries for names in the format .. will be answered with the device's IP addresses.
    domain:
  wireguard:
    # Enable/disable the wireguard server. Useful for development on non-linux machines.
    enabled: true
    # The wireguard network interface name
    interface: wg0
    # The maximum transmission unit (MTU) to be used on the server-side interface.
    mtu: 1420
  vpn:
    # The VPN IPv4 network range. VPN clients will be assigned IP addresses in this range. Set to 0 to disable IPv4.
    cidr: 10.44.0.0/24
    # IPv6 is disabled by default, since it leads to the pod failing if the k8s-cluster is not configured with IPv6 support
    cidrv6: 0
    # Disables NAT for IPv4
    nat44: true
    # Disables NAT for IPv6
    nat66: true
    # Block or allow traffic between client devices (client isolation)
    clientIsolation: false
    # The VPN gateway interface. VPN client traffic will be forwarded to this interface.
    # gatewayInterface: default gateway interface (e.g. eth0)
    # Allowed IPs that clients may route through this VPN. This will be set in the client's WireGuard connection file and routing is also enforced by the server using iptables.
    allowedIPs:
      - "0.0.0.0/0"
      - "::/0"
    # How the forwarding rules are set up: iptables, nftables or none
    # (wg-access-server >= v1.3.0). nftables is required for access policies
    # (vpn.policies); the image ships nft and NET_ADMIN is sufficient.
    firewall: iptables
    # Deprecated since v1.3.0, the same as `firewall: none`.
    disableIPTables: false
  clientConfig:
    dnsServers: []
    dnsSearchDomain: ""
    mtu: 1420
    # NOTE: capitalised - the server's yaml tag is `PersistentKeepalive`, and
    # yaml.v2 matches keys case-sensitively, so `persistentkeepalive` is
    # silently ignored.
    PersistentKeepalive: 0
  https:
    # Enable HTTPS for the web UI. The probes below use plain HTTP on port 8000,
    # so if you set config.httpEnabled: false (HTTPS only), also point them at
    # the HTTPS port with scheme HTTPS.
    enabled: false
    port: 8443
    # Listen host for the HTTPS server. Empty means all hosts.
    # host: ""
    # If not provided, a self-signed certificates will be generated
    certFile: ""
    keyFile: ""
  metrics:
    basicAuth:
      # Optional username to require when accessing /metrics.
      username: ""
      # Optional bcrypt hash for the metrics password (matches username above).
      passwordHash: ""
    # Caps how many devices are exported as individual time series on /metrics.
    # Device names and owners are user controlled, so an uncapped export lets any
    # user inflate the scraping Prometheus' cardinality.
    # Negative removes the cap, 0 exports only aggregates. Server default: 1000.
    # maxDeviceSeries: 1000

  # Authentication backends. Anything secret (OIDC client secrets, the session
  # store secret, htpasswd entries) belongs in `secretConfig` below instead, which
  # is merged over this block at startup.
  # auth:
  #   sessionStore:
  #     # How long a web session stays valid (default 720h). This is also how
  #     # long access revoked at the identity provider takes to take effect.
  #     maxAge: 720h
  #     # Mark the session cookie as Secure so browsers only send it over HTTPS.
  #     # Added in wg-access-server v1.1.0, defaults to false. The web UI is also
  #     # served over plain HTTP on port 8000, so only enable this when every user
  #     # reaches the UI via HTTPS - otherwise login breaks silently.
  #     secure: false

secretConfig:
  config: {}
  existingSecret:
  secretRefKeys:
    config: "secretConfig"

web:
  config:
    existingSecret:
    secretRefKeys:
      adminUsername: "adminUsername"
      adminPassword: "adminPassword"
    adminUsername: "admin"
    adminPassword: "admin"
    basicAuthEnabled: true
  service:
    annotations: {}
    externalTrafficPolicy: ""
    type: ClusterIP
    loadBalancerIP: ""

wireguard:
  config:
    existingSecret:
    secretRefKeys:
      privateKey: "privateKey"
    # REQUIRED: Set this value explicitly before deployment, or use existingSecret.
    privateKey: "qJvFeHHuffBaPWx4veJGQqXw6j5zdo5cSOaBd1Z0Km4="
  service:
    annotations: {}
    type: ClusterIP
    sessionAffinity: ClientIP
    externalTrafficPolicy: ""
    ipFamilyPolicy: SingleStack
    loadBalancerIP: ""
    externalIPs: []
    port: 51820
    nodePort:

storage:
  enabled: false
  uri: ""
  existingSecret: ""
  secretRefKeys:
    uri: "storageUri"

persistence:
  enabled: false
  existingClaim: ""
  annotations: {}
  accessModes:
    - ReadWriteOnce

  ## Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: ""
  size: 100Mi

initContainers: []

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  ingressClassName: ""
  hosts: []
    # - vpn.example.com
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

extraVolumes: ""

extraVolumeMounts: ""

nameOverride: ""

fullnameOverride: ""

# Optional Kubernetes target version override for Ingress API selection.
kubeTargetVersionOverride: ""

hostNetwork: false

imagePullSecrets: []

image:
  repository: ghcr.io/freifunkmuc/wg-access-server
  tag: ""
  pullPolicy: IfNotPresent

# multiple replicas is only supported when using
# a supported highly-available storage backend (i.e. postgresql).
# Replicas coordinate device creation through a Postgres advisory lock
# (wg-access-server >= v1.2.0); if pgbouncer sits in front of Postgres it
# must run in session pooling mode, or two devices can get the same VPN IP.
replicas: 1

strategy:
  type: ""
  # the deployment strategy type will default to "Recreate" when persistence is enabled
  # or "RollingUpdate" when persistence is not enabled.
  # type: Recreate

# Extra labels to add to the pod template, merged alongside the chart's own
# selector labels. Useful for e.g. giving a common label across multiple
# releases of this chart so a single ServiceMonitor/PodMonitor-style
# resource can select all of them without listing each release by name.
podLabels: {}

# Extra annotations to add to the pod template, merged alongside the
# chart's own checksum annotations. Useful for e.g. Prometheus
# scrape-annotation-based service discovery (prometheus.io/scrape, etc).
podAnnotations: {}

# set securityContext for the application pod. With some kernel versions, adding the
# 'NET_RAW' capability might be required for the iptables table to be initialized.
securityContext:
  capabilities:
    add: ['NET_ADMIN']

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

readinessProbe:
  httpGet:
    path: /health
    port: 8000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: 8000
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3
